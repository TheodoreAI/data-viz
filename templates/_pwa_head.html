<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" media="(prefers-color-scheme: light)">
<link rel="manifest" href="{{ url_for('static', filename='manifest-dark.json') }}" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Data Viz">

<meta property="og:site_name" content="Data Viz">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.url }}">
<meta property="og:title" content="{{ og_title | default('Data Viz') }}">
<meta property="og:description" content="{{ og_description | default('Explore Wikipedia article graphs and viewership trends.') }}">
<meta property="og:image" content="{{ og_image | default(url_for('static', filename='og/banner.png', _external=True)) }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title | default('Data Viz') }}">
<meta name="twitter:description" content="{{ og_description | default('Explore Wikipedia article graphs and viewership trends.') }}">
<meta name="twitter:image" content="{{ og_image | default(url_for('static', filename='og/banner.png', _external=True)) }}">

<!doctype html>
{% set og_title = "UV Index — Data Viz" %}
{% set og_description = "Check the current and forecast UV index for any coordinate." %}
<title>{{ og_title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% include '_theme_init.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% include '_pwa_head.html' %}

{% include '_navbar.html' %}

<div id="app"></div>
{{ vite_asset('uv-index') }}

{% include '_footer.html' %}

<style>
  body.uv-index-page {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  body.uv-index-page #app {
    flex: 1;
    background: #f7f6f3;
  }

  body.uv-index-page .footer {
    margin-top: auto;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body.uv-index-page #app {
      background: #171613;
    }

  :root[data-theme="dark"] body.uv-index-page #app {
    background: #171613;

<nav class="navbar">
  <button
    id="nav-toggle"
    class="nav-toggle"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
    aria-controls="nav-links"
  >
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>

  <div id="nav-links" class="nav-links">
    <a href="{{ url_for('hello_world') }}" data-mark="§01" class="{{ 'active' if request.path == url_for('hello_world') }}" {{ 'aria-current="page"' if request.path == url_for('hello_world') }}>Home</a>
    <a href="{{ url_for('trending_page') }}" data-mark="§02" class="{{ 'active' if request.path == url_for('trending_page') }}" {{ 'aria-current="page"' if request.path == url_for('trending_page') }}>Trending</a>
    <a href="{{ url_for('uv_index_page') }}" data-mark="§03" class="{{ 'active' if request.path == url_for('uv_index_page') }}" {{ 'aria-current="page"' if request.path == url_for('uv_index_page') }}>UV Index</a>
    {% if current_user %}
      <a href="{{ url_for('essays_page') }}" data-mark="§04" class="{{ 'active' if request.path == url_for('essays_page') }}" {{ 'aria-current="page"' if request.path == url_for('essays_page') }}>Essays</a>
      {% if current_user.is_admin %}
        <a href="{{ url_for('admin_page') }}" data-mark="§05" class="{{ 'active' if request.path == url_for('admin_page') }}" {{ 'aria-current="page"' if request.path == url_for('admin_page') }}>Admin</a>
      {% endif %}
      <a href="{{ url_for('profile_page') }}" data-mark="§06" class="{{ 'active' if request.path == url_for('profile_page') }}" {{ 'aria-current="page"' if request.path == url_for('profile_page') }}>{{ current_user.display_name or current_user.username }}</a>
    {% else %}
      <a href="{{ url_for('login_page') }}" data-mark="§04" class="{{ 'active' if request.path == url_for('login_page') }}" {{ 'aria-current="page"' if request.path == url_for('login_page') }}>Log in</a>
      <a href="{{ url_for('register_page') }}" data-mark="§05" class="{{ 'active' if request.path == url_for('register_page') }}" {{ 'aria-current="page"' if request.path == url_for('register_page') }}>Register</a>
    {% endif %}
    <span class="nav-version">v{{ app_version }}</span>
  </div>

  <button id="theme-toggle" class="theme-toggle" type="button" data-active-icon="moon" aria-label="Toggle dark/light theme" title="Toggle dark/light theme">
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5 7 7 0 0 0 20.5 14.5z" fill="currentColor" />
    </svg>
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5" fill="currentColor" />
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" />
      </g>
    </svg>
  </button>
</nav>
<div id="nav-backdrop" class="nav-backdrop"></div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

<nav class="navbar">
  <button
    id="nav-toggle"
    class="nav-toggle"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
    aria-controls="nav-links"
  >
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>

  <div id="nav-links" class="nav-links">
    <a href="{{ url_for('hello_world') }}" class="{{ 'active' if request.path == url_for('hello_world') }}" {{ 'aria-current="page"' if request.path == url_for('hello_world') }}>Home</a>
    <a href="{{ url_for('bubbles') }}" class="{{ 'active' if request.path == url_for('bubbles') }}" {{ 'aria-current="page"' if request.path == url_for('bubbles') }}>Bubbles</a>
    <a href="{{ url_for('movies') }}" class="{{ 'active' if request.path == url_for('movies') }}" {{ 'aria-current="page"' if request.path == url_for('movies') }}>Movies</a>
    <a href="{{ url_for('graph') }}" class="{{ 'active' if request.path == url_for('graph') }}" {{ 'aria-current="page"' if request.path == url_for('graph') }}>Graph</a>
    <a href="{{ url_for('time_travel_page') }}" class="{{ 'active' if request.path == url_for('time_travel_page') }}" {{ 'aria-current="page"' if request.path == url_for('time_travel_page') }}>Time Travel</a>
    {% if current_user %}
      <a href="{{ url_for('dashboard_page') }}" class="{{ 'active' if request.path == url_for('dashboard_page') }}" {{ 'aria-current="page"' if request.path == url_for('dashboard_page') }}>Dashboard</a>
      <a href="{{ url_for('posts_page') }}" class="{{ 'active' if request.path == url_for('posts_page') }}" {{ 'aria-current="page"' if request.path == url_for('posts_page') }}>Posts</a>
      <a href="{{ url_for('profile_page') }}" class="{{ 'active' if request.path == url_for('profile_page') }}" {{ 'aria-current="page"' if request.path == url_for('profile_page') }}>{{ current_user.display_name or current_user.username }}</a>
    {% else %}
      <a href="{{ url_for('login_page') }}" class="{{ 'active' if request.path == url_for('login_page') }}" {{ 'aria-current="page"' if request.path == url_for('login_page') }}>Log in</a>
      <a href="{{ url_for('register_page') }}" class="{{ 'active' if request.path == url_for('register_page') }}" {{ 'aria-current="page"' if request.path == url_for('register_page') }}>Register</a>
    {% endif %}
  </div>

  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark/light theme" title="Toggle dark/light theme">🌙</button>
</nav>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

<!doctype html>
<title>Wikipedia Bubble Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include '_theme_init.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% include '_pwa_head.html' %}

{% include '_navbar.html' %}

{% if articles is none %}
  <p style="max-width: 900px; margin: 2rem auto; padding: 0 1.25rem; color: #b0413e; font-family: 'Palatino Linotype', Palatino, Georgia, serif;">
    Couldn't load Wikipedia's most-viewed articles right now. Please try again later.
  </p>
{% else %}
  <div id="app"></div>
  <script id="chart-data" type="application/json">{{ {'articles': articles, 'date': date} | tojson }}</script>
  {{ vite_asset('bubbles') }}
{% endif %}

{% include '_footer.html' %}
